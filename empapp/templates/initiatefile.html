{% extends 'empbase.html' %}
{% load static %}
{% block employee %}
<div class="row">
    <div class="col-sm-8 mx-auto">
        <div class="card shadow px-3 py-4">
            <h2 class="text-center" style="color:rgb(14, 83, 31); font-family:'Algerian', serif;">Initiate file</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-sm-12">
                        <label for="title" class="form-label">Title</label>
                        <input type="text" name="title" id="title" class="form-control">
                    </div>
                    <div class="col-sm-12">
                        <label for="sub" class="form-label">subject</label>
                        <textarea name="subject" id="sub" class="form-control"></textarea>
                    </div>
                    <div class="col-sm-12">
                        <label for="fa" class="form-label">File attachment</label>
                        <input type="file" name="file_attachment" id="fa" class="form-control">
                    </div>
                    <h5>Forward To</h5>
                    <div class="col-sm-12">
                        <label for="emp" class="form-label">Select Employee</label>
                        <select name="emp_id" id="emp" class="form-select">
                            <option value="" selected disabled>Select Employee</option>
                            {% for emp in employees %}
                            <option value="{{emp.email}}">
                                {{emp.name}} ({{emp.department.dept_name}}) -- {{emp.email}}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-sm-12 text-center">
                        <button class="btn w-50" type="submit" style=" background-color:#042b10"><span
                                style="color:white;">Create Files
                            </span></button>
                    </div>
                </div>
        </div>
        </form>
    </div>
</div>
{% endblock %}
