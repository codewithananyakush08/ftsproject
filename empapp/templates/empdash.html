{% extends 'empbase.html' %}
{% load static %}
{% block employee %}
<style>
    .icon {
        height: 50px;
        width: 50px;
        background-color: #1f5a0d;
        border-radius: 100%;
    }
    .icon i {
        font-size: 20px;
        margin-top: 15px;
        margin-left: 12px;
        color: aliceblue
    }
</style>
<div class="container-fluid">
    <div class="row">
        <div class="col-sm-12">
            <div class="card p-4 " style="background-color: #287235; border-radius: 20px;">
                <h2 class="text-light">Welcome Employee </h2>
                <p style="color:aliceblue"> Mange complete file movement system from this dashboard.</p>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-4">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fa-regular fa-folder"></i></div>
                <h3 class="fw-bold mt-3 ms-2">{{file_init}}</h3>
                <p class="fw-bold ms-2"> Files Initiated</p>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fa-regular fa-clock"></i></div>
                <h3 class="fw-bold mt-3 ms-2">{{pending_files}}</h3>
                <p class="fw-bold ms-2">Pending Files</p>
            </div>


        </div>
        <div class="col-sm-4">
            <div class="card p-3 shadow-lg" style="border-radius: 30px;">
                <div class="icon"><i class="fa-regular fa-user"></i></div>
                <h3 class="fw-bold mt-3 ms-2">{{closed_files}}</h3>
                <p class="fw-bold ms-2">Close Files</p>
            </div>
        </div>
        
    </div>
</div>

{% endblock %}
