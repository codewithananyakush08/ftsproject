{% extends 'empbase.html' %}
{% load static %}
{% block employee %}
<div class="row">
    <div class="col-sm-6 mx-auto text-center">
        <div class="card shadow  px-4 py-4" style="border-radius: 4%;">
            <form method="post">
                {% csrf_token %}
                <img src="{% static 'admin/assets/images/leaf1.png' %}" height="80px" width="80px">
                <h4 style="color: #021a07; text-align:center;  font-family:'Algerian', serif;">Change Password Employee</h4><br>

                <div class="form-floating mb-3">
                    <input type="password" name="oldpwd" class="form-control" id="oldpwd" required
                        placeholder="Password">
                    <label for="oldpwd"> Old Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="newpwd" class="form-control" id="newpwd" required
                        placeholder="Password">
                    <label for="newpwd"> New Password</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" name="cnfpwd" class="form-control" id="confirmpwd" required
                        placeholder="Password">
                    <label for="confirmpwd"> Confirm Password</label>
                </div>
                <a href="#">
                    <button class="btn btn px-4 w-100  py-2 mt-2" type="submit" style=" background-color:#042b10"><span
                            style="color:white;">Update
                            Password</span></button>
                </a>
            </form>
        </div>
    </div>
</div>


{% endblock %}
