{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="row">
    <div class="col-sm-6 mx-auto">
        <div class="card  p-4 shadow">
            <h2 class="mb-4 text-center" style="color: rgb(4, 44, 4); font-family:'Algerian', serif;
">
                Add Department</h2>
            <form method="post">
                {% csrf_token %}
                <label for="dept" class="form-label">Department Name</label>
                <input type="text" name="dept_name" id="dept" class="form-control">
                <button type="submit" class="btn text-white  mt-4 w-100"
                    style="background-color: rgb(4, 44, 4);">Add</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
